<style>
:root {
  --bg: #f8f2f1;
  --card: #fffafa;
  --text: #292526;
  --muted: #8c8181;
  --pink: #c98f9d;
  --pink-light: #f1dfe3;
  --pink-pale: #f8ecee;
  --danger: #b85f68;
  --border: #eadedf;
  --dark: #302b2c;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "SF Pro Text", Arial, sans-serif;
}

.app {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 18px 16px 100px;
}

h1, h2, h3, p {
  margin: 0;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.header-title {
  font-size: 27px;
  font-weight: 750;
  letter-spacing: -0.7px;
}

.month {
  color: var(--muted);
  font-size: 14px;
}

/* HERO */

.hero {
  background: var(--dark);
  color: white;
  border-radius: 28px;
  padding: 24px;
  margin-bottom: 14px;
}

.hero-label {
  font-size: 14px;
  opacity: .7;
  margin-bottom: 8px;
}

.hero-number {
  font-size: 43px;
  font-weight: 800;
  letter-spacing: -1.5px;
}

.hero-sub {
  margin-top: 8px;
  font-size: 14px;
  opacity: .72;
  line-height: 1.4;
}

.progress {
  height: 7px;
  background: rgba(255,255,255,.14);
  border-radius: 10px;
  margin-top: 20px;
  overflow: hidden;
}

.progress-inner {
  height: 100%;
  width: 0%;
  background: #e5b9c3;
  border-radius: 10px;
  transition: width .25s;
}

/* CARDS */

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 23px;
  padding: 19px;
  margin-bottom: 12px;
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 14px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 14px;
}

.stat-row span:first-child {
  color: var(--muted);
}

.stat-value {
  font-weight: 700;
}

/* BUTTON */

.primary {
  width: 100%;
  border: 0;
  background: var(--pink);
  color: white;
  padding: 16px;
  border-radius: 17px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.primary:active {
  transform: scale(.98);
}

.secondary {
  width: 100%;
  border: 0;
  background: var(--pink-light);
  color: #64484f;
  padding: 14px;
  border-radius: 15px;
  font-size: 15px;
  font-weight: 650;
  cursor: pointer;
}

/* CATEGORY */

.category-row {
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.category-row:last-child {
  border-bottom: 0;
}

.category-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.category-name {
  font-size: 14px;
  font-weight: 650;
}

.category-remaining {
  font-size: 14px;
  font-weight: 750;
}

.category-remaining.negative {
  color: var(--danger);
}

.category-meta {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}
